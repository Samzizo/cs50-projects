{% extends "layout.html" %}

{% block title %}
    ADD
{% endblock %}

{% block main %}
    <form action="/add" method="post" class="cart">
        <div class="">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="question" placeholder="question" type="text">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" name="answer" placeholder="answer" type="text">
        </div>
        <div class="mb-3">
            <label>Choose lunguage: </label>
            <select class="opt" name="language">
                <option value="python">Python</option>
                <option value="C">C</option>
                <option value="javaScript">Js</option>
                <option value="java">Java</option>
            </select>
        </div>
        <button class="opt" type="submit" name="submit_button" value="add">ADD Question</button>
    </form>
{% endblock %}
