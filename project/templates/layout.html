<!DOCTYPE html>

<html lang="en">

    <head>
        <!-- font awsom -->
        <script src="https://kit.fontawesome.com/241bc4b752.js" crossorigin="anonymous"></script>
        <meta charset="utf-8">
        <!-- http://getbootstrap.com/docs/5.1/ -->
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.1/jquery.min.js"></script>
        <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/js/bootstrap.min.js"></script>

        <!-- https://favicon.io/emoji-favicons/money-bag/ -->
        <link rel="shortcut icon" href="/favicon.ico" />
        <link href="./static/styles.css" rel="stylesheet">
        <!-- <link rel="shortcut icon" href="#"> -->

        <link rel="icon" href="../static/images/qm.png" type="image/icon type">

        <title>Tester: {% block title %}{% endblock %}</title>


    </head>

    <body>
        <nav class="navbar navbar-inverse">
            <div class="container-fluid">
                <div class="navbar-header">
                    <a class="navbar-brand" href="/" style="color: #FF87B7;">Tester <i class="fa fa-check"></i> </a>
                </div>
                <ul class="nav navbar-nav">
                    <li ><a href="/list" class="active">List <i class="fa fa-clipboard-list"></i> </a></li>
                    <li><a href="/add">ADD <i class="fa fa-plus"></i></a></li>
                    <li><a href="/play">Play <i class="fa fa-puzzle-piece"></i></a></li>
                </ul>
                <ul class="nav navbar-nav navbar-right">
                    <li><a href="/sign_up"><i class="fa fa-user"></i> Sign Up</a></li>
                    <li><a href="/login"><i class="fa fa-sign-in-alt"></i> Login</a></li>
                    <li> <a href="/logout"> Log Out <i class="fa fa-sign-out-alt"></i></a></li>
                </ul>
            </div>
        </nav>

        {% if get_flashed_messages() %}
            <header>
                <div class="alert alert-danger mb-0 text-center" role="alert">
                    {{ get_flashed_messages() | join(" ") }}
                </div>
            </header>
        {% endif %}

        <main class="container-fluid py-5 text-center">
            {% block main %}{% endblock %}
        </main>


        <footer class="ft">
            All right reserved for <i class="fa fa-copyright"></i>
            <a href="https://github.com/Samzizo" target="_blank">
                <i class="fa fa-github">
                    Samiha Amroune
                </i>
            </a>
        </footer>
        <script src="./static/action.js" ></script>

    </body>

</html>
